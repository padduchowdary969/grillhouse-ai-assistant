name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: grillhouse
          POSTGRES_USER: grillhouse
          POSTGRES_PASSWORD: ci-owner-password
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U grillhouse -d grillhouse"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_PASSWORD: ci-owner-password
      GRILLHOUSE_READONLY_PASSWORD: ci-readonly-password
      GRILLHOUSE_PASSWORD: ci-chat-password
      GRILLHOUSE_JWT_SECRET: ci-jwt-secret-not-for-production
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      GIT_PYTHON_REFRESH: quiet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create database roles and schemas
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGPASSWORD: ci-owner-password
          POSTGRES_USER: grillhouse
          POSTGRES_DB: grillhouse
        run: bash db/init/01_roles.sh

      - name: Build demo data (seed -> clean -> database -> dbt tests -> forecast)
        run: python -m pipelines.run_all

      - name: Synthetic data matches the committed copy
        run: git diff --exit-code --stat -- seed_data/

      - name: Tests
        run: python -m pytest

  images:
    # Build both images on every run; publish them to GitHub Container Registry from main only
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [pipeline, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3   # arm64 builds on the amd64 runner

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/grillhouse-${{ matrix.target }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=grillhouse-${{ matrix.target }}
            org.opencontainers.image.description=Grill House Ops Copilot (${{ matrix.target }} image), synthetic demo data only

      - name: Build${{ github.ref == 'refs/heads/main' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          # Published images run natively on Intel/AMD and ARM (Apple silicon, Graviton); PR builds stay amd64-only
          platforms: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Smoke test
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm --entrypoint python "$IMAGE" -c "import app.api, app.sql_tool, app.documents; print('imports ok')"
          docker run --rm --entrypoint sh "$IMAGE" -c 'test "$(id -u)" = 10001 && ! test -e .env && ! test -e data && echo "non-root, no secrets, no private data"'
